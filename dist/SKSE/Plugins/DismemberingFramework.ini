; Dismembering Framework - Developper Settings
; WARNING: The parameters in this file are intended for advanced users. These are advanced features that you probably do not want to modify.

[General]
# This parameter determines the verbosity level used by the framework for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# When enabled, this parameter allows the framework's resources to be loaded asynchronously, preventing any delay in the game's startup (1 enable, 0 disable).
bAsynchronousStartup = 1

# Delays dismemberment processing by one frame to confirm if the hit actually resulted in the actor's death (1 enable, 0 disable).
bDeferredHitProcess = 1

# This parameter skips dependency checks during component loading when set to 1 (1 enable, 0 disable).
bShouldIgnoreMaintenanceChecks = 0


[Misc]
# Allows dismembered actors to be reanimated (1 enable, 0 disable).
bDismemberedCanBeReanimated = 1

# Allows severed limbs to adapt to the actor's scale (1 enable, 0 disable).
bAllowLimbScaling = 1

# Fixes a potential crash with True Directional Movement's predictive aiming feature.
bTrueDirectionalMovementFix = 1
